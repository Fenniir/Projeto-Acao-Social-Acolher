<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/static/CEI_Logo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <title>Ação Social - Registrar Doações - CEI</title>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-3" href="/">Projeto Acolher</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav mx-auto gap-lg-2 my-3 my-lg-0">
          <li class="nav-item"><a class="nav-link app-nav-pill" href="/estoque/">Estoque</a></li>
          <li class="nav-item"><a class="nav-link app-nav-pill" href="/doacao/">Doação</a></li>
          <li class="nav-item"><a class="nav-link app-nav-pill active" href="/registrar/">Registrar Doações</a></li>
        </ul>
        <a href="/login/" class="btn btn-light rounded-circle p-1 login-icon-link" aria-label="Login">
          <img src="/static/Imagens/Login_Icon_2.png" alt="Login" class="login-icon">
        </a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-lg-5 app-page">
    <section class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body p-4">
        <p class="text-primary text-uppercase fw-bold small mb-1 letter-space">Novo registro</p>
        <h1 class="display-6 fw-bold mb-2">Registrar Doações</h1>
        <p class="text-secondary mb-0">Preencha o formulário abaixo para registrar uma nova doação no banco de dados.</p>
      </div>
    </section>
    <section class="row justify-content-center">
      <div class="col-12 col-lg-8 col-xl-7">
        <form id="acaoSocialRegistrarDoacoesDiv" class="card border-0 shadow-sm rounded-4 p-4">
          <div id="feedbackFormulario" class="alert d-none" role="alert" aria-live="polite"></div>
          <div class="mb-3">
            <label for="doacaoItem" class="form-label fw-semibold">Doação</label>
            <input type="text" id="doacaoItem" class="form-control form-control-lg" placeholder="Exemplo: Blusa">
          </div>
          <div class="mb-3">
            <label for="remetente" class="form-label fw-semibold">Remetente</label>
            <input type="text" id="remetente" class="form-control form-control-lg" placeholder="Nome do doador">
          </div>
          <div class="mb-3">
            <label for="quantidade" class="form-label fw-semibold">Quantidade</label>
            <input type="number" min="1" id="quantidade" class="form-control form-control-lg"
              placeholder="Quantidade do item doado">
          </div>
          <div class="mb-3">
            <label for="cpfCnpj" class="form-label fw-semibold">CPF/CNPJ</label>
            <input type="text" id="cpfCnpj" class="form-control form-control-lg" placeholder="Opcional">
          </div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="status" class="form-label fw-semibold">Status</label>
              <select id="status" class="form-select form-select-lg">
                <option value="null">Selecione...</option>
                <option value="Recebido">Recebido</option>
                <option value="Repassado">Repassado</option>
                <option value="Processado">Processado</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label for="data" class="form-label fw-semibold">Data</label>
              <input type="date" id="data" class="form-control form-control-lg">
            </div>
          </div>
          <button type="submit" id="registrarDoacaoBotao" class="btn btn-primary btn-lg fw-bold mt-4">Registrar Doação</button>
        </form>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
