<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/static/CEI_Logo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <title>Ação Social - Doação - CEI</title>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-3" href="/">Projeto Acolher</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav mx-auto gap-lg-2 my-3 my-lg-0">
          <li class="nav-item"><a class="nav-link app-nav-pill" href="/estoque/">Estoque</a></li>
          <li class="nav-item"><a class="nav-link app-nav-pill active" href="/doacao/">Doação</a></li>
          <li class="nav-item"><a class="nav-link app-nav-pill" href="/registrar/">Registrar Doações</a></li>
        </ul>
        <a href="/login/" class="btn btn-light rounded-circle p-1 login-icon-link" aria-label="Login">
          <img src="/static/Imagens/Login_Icon_2.png" alt="Login" class="login-icon">
        </a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-lg-5 app-page">
    <section class="card border-0 shadow-sm rounded-4 mb-4">
      <div class="card-body p-4">
        <p class="text-primary text-uppercase fw-bold small mb-1 letter-space">Histórico</p>
        <h1 class="display-6 fw-bold mb-2">Doações</h1>
        <p class="text-secondary mb-0">Acompanhe as doações registradas no banco de dados.</p>
      </div>
    </section>
    <section class="row g-3 mb-4" aria-label="Resumo das doações">
      <div class="col-12 col-md-4">
        <div class="card metric-card h-100 shadow-sm border-0 rounded-4">
          <div class="card-body"><span class="text-secondary fw-semibold">Doações cadastradas</span><strong
              id="totalDoacoes" class="d-block fs-1 lh-1 mt-2">0</strong></div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card metric-card h-100 shadow-sm border-0 rounded-4">
          <div class="card-body"><span class="text-secondary fw-semibold">Quantidade total</span><strong
              id="quantidadeDoada" class="d-block fs-1 lh-1 mt-2">0</strong></div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card metric-card metric-green h-100 shadow-sm border-0 rounded-4">
          <div class="card-body"><span class="text-secondary fw-semibold">Última doação</span><strong id="ultimaDoacao"
              class="d-block fs-2 lh-1 mt-2 text-truncate">-</strong></div>
        </div>
      </div>
    </section>
    <section class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
          <h2 class="h4 fw-bold mb-0">Registros encontrados</h2>
          <input id="buscaItens" class="form-control app-search" type="search" placeholder="Buscar doação ou doador...">
        </div>
        <div id="acaoSocialEstoqueScrollbar" class="vstack gap-3"></div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
