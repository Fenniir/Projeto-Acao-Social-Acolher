<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/static/Imagens/CEI_Logo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <title>Doações - Projeto Acolher</title>
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="sidebar-logo" href="/">
        <img src="/static/Imagens/CEI_Logo.png" alt="CEI">
        <span>Projeto Acolher</span>
      </a>

      <nav class="sidebar-menu" aria-label="Menu principal">
        <a class="sidebar-link " href="/">Painel inicial</a>
        <a class="sidebar-link active" href="/doacao/">Doações</a>
        <a class="sidebar-link " href="/registrar/">Registrar doação</a>
        <a class="sidebar-link " href="/estoque/">Estoque</a>
      </nav>
</aside>

    <main class="app-page">
      <section class="page-header-card">
        <div>
          <span class="page-kicker">Controle</span>
          <h1 class="page-title">Doações</h1>
        </div>
        
      </section>

      <section class="metric-strip" aria-label="Resumo">
        <div class="metric-mini"><span>Registros</span><strong id="totalDoacoes">0</strong></div>
        <div class="metric-mini"><span>Quantidade total</span><strong id="quantidadeDoada">0</strong></div>
        <div class="metric-mini"><span>Total de repasses</span><strong id="totalRepasses">0</strong></div>
        <div class="metric-mini"><span>Última doação</span><strong id="ultimaDoacao" class="text-truncate">-</strong></div>
      </section>

      <section class="table-panel">
        <div class="table-title-bar">
          <h2>Lista de doações</h2>
        </div>
        <div class="table-toolbar">
          <input id="buscaItens" class="form-control app-search" type="search" placeholder="Pesquisar por item, doador, tipo, CPF/CNPJ ou descrição">
          <select id="filtroStatus" class="form-select app-filter">
            <option value="">Todos os status</option>
            <option value="Recebido">Recebido</option>
            <option value="Processando">Processando</option>
            <option value="Repassado">Repassado</option>
          </select>
          <select id="filtroTipo" class="form-select app-filter">
            <option value="">Todos os tipos</option>
            <option value="Alimento">Alimento</option>
            <option value="Roupa">Roupa</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div id="acaoSocialEstoqueScrollbar" class="planilha-wrap"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
