<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="CEI_Logo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Login - CEI</title>
</head>

<body id="loginBody" class="login-bg">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <form class="card border-0 shadow rounded-4 p-4 login-card" action="">
      <a href="index.html" class="text-center mb-3"><img src="Imagens/CEI_Logo_4.png" alt="Página inicial"
          class="login-logo"></a>
      <h1 class="h3 fw-bold text-center">Projeto Acolher</h1>
      <p class="text-secondary text-center mb-4">Controle de doações e estoque</p>
      <div class="mb-3">
        <label for="loginUsuarioEmail" class="form-label fw-semibold">E-mail</label>
        <input type="email" id="loginUsuarioEmail" class="form-control form-control-lg" placeholder="Digite seu e-mail">
      </div>
      <div class="mb-3">
        <label for="loginUsuarioSenha" class="form-label fw-semibold">Senha</label>
        <input type="password" id="loginUsuarioSenha" class="form-control form-control-lg"
          placeholder="Digite sua senha">
      </div>
      <button type="submit" class="btn btn-primary btn-lg fw-bold w-100">Entrar/Registrar</button>
      <p id="loginMensagem" class="text-center fw-semibold mt-3 mb-0"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
